[package]
name = "ichnos-app"
description = "Ichnos's native viewer: a live timeline of coding-agent sessions, built with GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ichnos-app"
path = "src/main.rs"

[dependencies]
ichnos-core.workspace = true
ichnos-model.workspace = true
ichnos-search.workspace = true
chrono.workspace = true
clap.workspace = true
accesskit = "0.24"
gpui-kit = "0.7"
mimalloc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }

[features]
# `ICHNOS_SHOTS=<dir> cargo run -p ichnos-app --features screenshots -- <session>` renders the
# viewer headlessly into PNGs, to look at it without a screen.
screenshots = ["gpui-kit/test-support"]

[lints]
workspace = true

[dev-dependencies]
gpui-kit = { version = "0.7", features = ["test-support"] }
tempfile.workspace = true
