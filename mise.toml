[tools]
rust = "stable"

[tasks.install]
description = "Build and install ichnos and ichnos-app into ~/.cargo/bin, and Ichnos.app on macOS"
run = [
  "cargo install --locked --path crates/ichnos",
  "cargo install --locked --path crates/ichnos-app",
  "if [ \"$(uname)\" = Darwin ]; then crates/ichnos-app/macos/bundle.sh; fi",
]

[tasks.app]
description = "Run the viewer from source"
run = "cargo run -p ichnos-app"

[tasks.check]
description = "Format check, lint and test everything"
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets -- -D warnings",
  "cargo test",
]
